      markers = [];

      locations.forEach(loc => {
        if (selectedDay === 'all' || loc.day === selectedDay) {
          let iconHtml = '';
          let iconSize = [32, 32];
          let iconAnchor = [16, 16];

          if (loc.type === 'parking') {
            iconHtml = `<div class="parking-marker">P</div>`;
            iconSize = [28, 28];
            iconAnchor = [14, 14];
          } else if (loc.type === 'alt') {
            iconHtml = `<div class="alt-marker" style="background-color: ${loc.color};">Alt</div>`;
          } else {
            iconHtml = `<div class="day-marker" style="background-color: ${loc.color};">${loc.day}</div>`;
          }

          const icon = L.divIcon({
            className: 'custom-div-icon',
            html: iconHtml,
            iconSize: iconSize,
            iconAnchor: iconAnchor
          });

          const typeLabel = loc.type === 'parking' ? '🅿️ נקודת חניה' : (loc.type === 'alt' ? '🔄 חלופה / אופציה' : '📍 אתר ראשי');

          const popupContent = `
            <div style="font-family: 'Assistant', sans-serif; direction: rtl; text-align: right; min-width: 210px;">
              <span style="font-size: 11px; font-weight: 700; color: #64748b;">${typeLabel} (יום ${loc.day})</span>
              <h3 style="margin: 2px 0 6px; font-size: 16px; font-weight: 800; color: ${loc.color};">${loc.name}</h3>
              <p style="margin: 0 0 10px; font-size: 13.5px; color: #334155; line-height: 1.3;">${loc.desc}</p>
              <div style="display: flex; gap: 6px;">
                <a href="https://maps.google.com/?q=${loc.lat},${loc.lng}" target="_blank" style="background: #059669; color: white; padding: 4px 8px; border-radius: 5px; text-decoration: none; font-size: 12px; font-weight: bold;">Google Maps</a>
                <a href="${loc.waze}" target="_blank" style="background: #0284c7; color: white; padding: 4px 8px; border-radius: 5px; text-decoration: none; font-size: 12px; font-weight: bold;">Waze</a>
              </div>
            </div>
          `;

          const marker = L.marker([loc.lat, loc.lng], { icon: icon }).bindPopup(popupContent);
          marker.addTo(map);
          markers.push(marker);
        }
      });
    }

    function filterDay(day) {
      renderMarkers(day);
    }

    renderMarkers('all');
  </script>
</body>
</html>
