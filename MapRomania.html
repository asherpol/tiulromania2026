<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מפת מסלול רומניה 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Assistant', sans-serif; background-color: #f0f9ff; }
    .day-marker {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 15px;
      border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body class="text-slate-900 min-h-screen p-3 md:p-6 flex flex-col gap-4">

  <!-- כותרת עליונה -->
  <header class="bg-white border-2 border-sky-300 rounded-2xl p-4 md:p-6 shadow-md text-center">
    <h1 class="text-2xl md:text-4xl font-extrabold text-sky-950 mb-1">🗺️ מפת אתרים וניווט – רומניה 2026</h1>
    <p class="text-slate-700 text-base md:text-lg">סינון נקודות לפי ימי הטיול, צבעים ייחודיים וקישורי ניווט ישירים</p>
    
    <!-- כפתורי סינון ימים -->
    <div class="flex flex-wrap justify-center gap-2 mt-4" id="filter-buttons">
      <button onclick="filterDay('all')" class="day-btn bg-sky-950 text-white px-3 py-1.5 rounded-lg text-base font-bold shadow hover:bg-sky-900 transition">הכל (11 ימים)</button>
      <button onclick="filterDay(1)" class="day-btn bg-blue-600 text-white px-3 py-1.5 rounded-lg text-base font-bold shadow hover:opacity-90">יום 1</button>
      <button onclick="filterDay(2)" class="day-btn bg-teal-600 text-white px-3 py-1.5 rounded-lg text-base font-bold shadow hover:opacity-90">יום 2</button>
      <button onclick="filterDay(4)" class="day-btn bg-amber-600 text-white px-3 py-1.5 rounded-lg text-base font-bold shadow hover:opacity-90">יום 4</button>
      <button onclick="filterDay(5)" class="day-btn bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-base font-bold shadow hover:opacity-90">יום 5</button>
      <button onclick="filterDay(6)" class="day-btn bg-purple-600 text-white px-3 py-1.5 rounded-lg text-base font-bold shadow hover:opacity-90">יום 6</button>
      <button onclick="filterDay(7)" class="day-btn bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-base font-bold shadow hover:opacity-90">יום 7</button>
      <button onclick="filterDay(8)" class="day-btn bg-rose-600 text-white px-3 py-1.5 rounded-lg text-base font-bold shadow hover:opacity-90">יום 8</button>
      <button onclick="filterDay(9)" class="day-btn bg-cyan-700 text-white px-3 py-1.5 rounded-lg text-base font-bold shadow hover:opacity-90">יום 9</button>
      <button onclick="filterDay(10)" class="day-btn bg-orange-600 text-white px-3 py-1.5 rounded-lg text-base font-bold shadow hover:opacity-90">יום 10</button>
    </div>
  </header>

  <!-- מפה אינטראקטיבית -->
  <div class="bg-white border-2 border-sky-300 rounded-2xl p-2 shadow-md">
    <div id="map" class="w-full h-[550px] md:h-[650px] rounded-xl"></div>
  </div>

  <script>
    const locations = [
      { day: 1, name: "נמל תעופה OTP", lat: 44.5707, lng: 26.0844, color: "#2563eb", desc: "נחיתה, איסוף רכב שכור ויציאה צפונה.", waze: "https://waze.com/ul?q=Henri+Coanda+Airport" },
      { day: 1, name: "קניון Shopping City Ploiești", lat: 44.9662, lng: 25.9922, color: "#2563eb", desc: "סים מקומי, כספומט והצטיידות ענקית ב-Carrefour.", waze: "https://waze.com/ul?q=Shopping+City+Ploiesti" },
      { day: 1, name: "וילה כפרית ברשנוב", lat: 45.5900, lng: 25.4600, color: "#2563eb", desc: "בסיס הלינה שלכם בטרנסילבניה ל-7 לילות.", waze: "https://waze.com/ul?q=Rasnov" },
      
      { day: 2, name: "פויאנה בראשוב (רכבל פוסטווארול)", lat: 45.5947, lng: 25.5539, color: "#0d9488", desc: "עלייה בגונדולה לפסגה (1,799 מ') לתצפית 360 מעלות.", waze: "https://waze.com/ul?q=Telegondola+Postavarul" },
      { day: 2, name: "בית חב\"ד בראשוב", lat: 45.6450, lng: 25.5920, color: "#0d9488", desc: "סעודה מפסקת לקראת יום כיפור.", waze: "https://waze.com/ul?q=Chabad+Brasov" },
      { day: 2, name: "כנסיית המבצר בפרז'מר (חלופה א')", lat: 45.7222, lng: 25.7744, color: "#0d9488", desc: "אתר מורשת אונסק\"ו מהמאה ה-13 עם 270 תאי מגורים בחומה.", waze: "https://waze.com/ul?q=Prejmer+Fortified+Church" },

      { day: 4, name: "שמורת הדובים ליברטי (זרנשט)", lat: 45.5800, lng: 25.3350, color: "#d97706", desc: "סיור האכלה של דובים חומים ביער טבעי (להביא דרכונים).", waze: "https://waze.com/ul?q=Libearty+Bear+Sanctuary+Zarnesti" },
      { day: 4, name: "טירת בראן (\"דרקולה\")", lat: 45.5152, lng: 25.3672, color: "#d97706", desc: "מבצר מהמאה ה-14, חצר גלריות עץ ושוק גבינות.", waze: "https://waze.com/ul?q=Bran+Castle" },
      { day: 4, name: "מגלשת הרים בפונדטה", lat: 45.4540, lng: 25.3600, color: "#d97706", desc: "מגלשה אלפינית חדישה לאורך 1.6 ק\"מ מול הנוף.", waze: "https://waze.com/ul?q=Cheile+Gradistei+Fundata" },
      { day: 4, name: "הכפרים פשטרה ומגורה (Amfiteatrul)", lat: 45.5050, lng: 25.2900, color: "#d97706", desc: "תצפיות פסטורליות עוצרות נשימה וקפה מול הרכסים.", waze: "https://waze.com/ul?q=Amfiteatrul+Transilvania" },

      { day: 5, name: "קניון 7 הסולמות", lat: 45.5650, lng: 25.6420, color: "#059669", desc: "מסלול מפלים וסולמות מתכת ואומגות ביער.", waze: "https://waze.com/ul?q=Canionul+7+Scari" },
      { day: 5, name: "חוות הפורלים ברשנוב", lat: 45.5820, lng: 25.4450, color: "#059669", desc: "דייג עצמאי וארוחת דגים טריים עם ממליגה ומוז'דיי.", waze: "https://waze.com/ul?q=Pastravarie+Rasnov" },
      { day: 5, name: "מסעדת Coliba Haiducilor (פויאנה בראשוב)", lat: 45.5980, lng: 25.5560, color: "#059669", desc: "מסעדת ציידים אותנטית מעוטרת עורות וקרניים עם פולקלור ופפנאש.", waze: "https://waze.com/ul?q=Coliba+Haiducilor+Poiana+Brasov" },

      { day: 6, name: "מצודת סיגישוארה (אונסק\"ו)", lat: 46.2197, lng: 24.7928, color: "#9333ea", desc: "עיר מבצר מימי הביניים, מגדל השעון ומדרגות התלמידים.", waze: "https://waze.com/ul?q=Sighisoara+Citadel" },
      { day: 6, name: "מבצר רופאה", lat: 46.0375, lng: 25.2210, color: "#9333ea", desc: "מבצר ספירלי על סלע בזלת ענק עם תצפית 360 מעלות.", waze: "https://waze.com/ul?q=Cetatea+Rupea" },
      { day: 6, name: "הכפר ויסקרי (אונסק\"ו)", lat: 46.0550, lng: 25.0900, color: "#9333ea", desc: "כנסייה מבוצרת וכפר סקסוני אותנטי בפטרונות המלך צ'ארלס.", waze: "https://waze.com/ul?q=Viscri+Fortified+Church" },
      { day: 6, name: "ארמון פלש (חלופה ב')", lat: 45.3599, lng: 25.5426, color: "#9333ea", desc: "מעון הקיץ המלכותי המפואר של המלך קרול הראשון.", waze: "https://waze.com/ul?q=Peles+Castle" },
      { day: 6, name: "אגם בולבוצ'י ומערת יאלומיצה (בוצ'ג'י)", lat: 45.3610, lng: 25.4380, color: "#9333ea", desc: "מנזר בפתח מערה, גשרי עץ בבטן ההר ואגם אלפיני בגובה 1,438 מ'.", waze: "https://waze.com/ul?q=Pestera+Ialomitei" },

      { day: 7, name: "רכבל בליה ואגם בליה (טרנספגראשן)", lat: 45.6025, lng: 24.6175, color: "#4f46e5", desc: "רכבל מעל מפל בליה אל אגם קרחוני בגובה 2,034 מ'.", waze: "https://waze.com/ul?q=Telecabina+Balea+Cascada" },
      { day: 7, name: "קניון זרנשט (חלופה ב')", lat: 45.5480, lng: 25.2860, color: "#4f46e5", desc: "הליכה מישורית מוצלת בנקיק גיר צר עם קירות סלע של 200 מ'.", waze: "https://waze.com/ul?q=Fantana+lui+Botorog" },

      { day: 8, name: "פארק חבלים Parc Aventura Brașov", lat: 45.6150, lng: 25.6400, color: "#e11d48", desc: "16 מסלולי טיפוס ואומגות ענק סביב אגם נואה.", waze: "https://waze.com/ul?q=Parc+Aventura+Brasov" },
      { day: 8, name: "קניון ומערת דמבוביצ'וארה", lat: 45.4430, lng: 25.2220, color: "#e11d48", desc: "מערת נטיפים מוארת, נקיק מים ודוכני גבינות במעבר רוקאר-בראן.", waze: "https://waze.com/ul?q=Pestera+Dambovicioara" },

      { day: 9, name: "העיר העתיקה וקרטורשטי (בוקרשט)", lat: 44.4320, lng: 26.1000, color: "#0e7490", desc: "רובע ליפקאני, חנות הספרים הלבנה ומסעדת Caru' cu Bere.", waze: "https://waze.com/ul?q=Carturesti+Carusel" },
      { day: 9, name: "קניון AFI Cotroceni", lat: 44.4300, lng: 26.0530, color: "#0e7490", desc: "הקניון הגדול ברומניה עם משטח החלקה על הקרח וקניות.", waze: "https://waze.com/ul?q=AFI+Cotroceni" },

      { day: 10, name: "מרחצאות טרמה (Therme București)", lat: 44.6050, lng: 26.0820, color: "#ea580c", desc: "ספא ענק, 1,500 דקלים, בריכות תרמיות ומגלשות מים.", waze: "https://waze.com/ul?q=Therme+Bucuresti" },
      { day: 10, name: "קניון בניאסה (Băneasa Shopping City)", lat: 44.5070, lng: 26.0860, color: "#ea580c", desc: "מתחם קניות יוקרתי, מזכרות וסופרמרקט ענק.", waze: "https://waze.com/ul?q=Baneasa+Shopping+City" },
      { day: 10, name: "מלון Hilton Garden Inn OTP", lat: 44.5715, lng: 26.0815, color: "#ea580c", desc: "לינה מול הטרמינל והחזרת הרכב השכור בנחת בערב.", waze: "https://waze.com/ul?q=Hilton+Garden+Inn+Bucharest+Airport" }
    ];

    const map = L.map('map').setView([45.2, 25.5], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let markers = [];

    function renderMarkers(selectedDay) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      locations.forEach(loc => {
        if (selectedDay === 'all' || loc.day === selectedDay) {
          const icon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div class="day-marker" style="background-color: ${loc.color};">${loc.day}</div>`,
            iconSize: [32, 32],
            iconAnchor: [16, 16]
          });

          const popupContent = `
            <div style="font-family: 'Assistant', sans-serif; direction: rtl; text-align: right; min-width: 200px;">
              <h3 style="margin: 0 0 5px; font-size: 17px; font-weight: 800; color: ${loc.color};">יום ${loc.day}: ${loc.name}</h3>
              <p style="margin: 0 0 10px; font-size: 14px; color: #334155; line-height: 1.3;">${loc.desc}</p>
              <div style="display: flex; gap: 6px;">
                <a href="https://maps.google.com/?q=${loc.lat},${loc.lng}" target="_blank" style="background: #059669; color: white; padding: 4px 8px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold;">Google Maps</a>
                <a href="${loc.waze}" target="_blank" style="background: #0284c7; color: white; padding: 4px 8px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold;">Waze</a>
              </div>
            </div>
          `;

          const marker = L.marker([loc.lat, loc.lng], { icon: icon }).bindPopup(popupContent);
          marker.addTo(map);
          markers.push(marker);
        }
      });
    }

    function filterDay(day) {
      renderMarkers(day);
    }

    renderMarkers('all');
  </script>
</body>
</html>
